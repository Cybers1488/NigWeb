    sprite: _Classic/Structures/Walls/metal.rsi
    state: full
  - type: Icon
    sprite: _Classic/Structures/Walls/metal.rsi
    state: full
  - type: IconSmooth
    mode: CardinalFlags
    key: walls
    base: metal
  - type: Destructible
