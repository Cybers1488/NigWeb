- type: entity
  parent: BaseWall
  id: NigWebClassicWallLeviathan
  name: стена левиафана
  description: Жуткая стена из плоти и металла.
  components:
  - type: Sprite
    sprite: _Classic/Structures/Walls/leviathan.rsi
    state: full
  - type: Icon
    sprite: _Classic/Structures/Walls/leviathan.rsi
    state: full
  - type: IconSmooth
    mode: CardinalFlags
    key: walls
    base: leviathan
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RCDDeconstructable
    cost: 10
    delay: 15
    fx: EffectRCDDeconstruct8
