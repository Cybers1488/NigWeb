# Directional body slash spurt effect — spawned client-side right on the torso/body
# when an entity with blood is slashed or pierced in melee combat.
- type: entity
  id: EffectBloodHit
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.36
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      state: squirt_0_0
      sprite: _NigWeb/Decals/lifeweb_blood.rsi
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu

