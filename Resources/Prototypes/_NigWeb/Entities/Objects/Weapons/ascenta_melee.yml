# SPDX-License-Identifier: MIT

# Base Melee Weapon Prototype
- type: entity
  abstract: true
  parent: BaseItem
  id: NigWebAscentaMeleeBase
  name: Ascenta Melee Base
  components:
  - type: Sprite
    sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_melee.rsi
  - type: Tag
    tags:
    - Sidearm
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: NigWebAscentaMeleeBase
  id: NigWebAscentaSwordBroadsword
  name: Gladius Latus
  suffix: Ascenta
  components:
  - type: Sprite
    layers:
    - state: broadsword
  - type: MeleeWeapon
    canWideSwing: true
    animation: WeaponArcSlash
    wideAnimationRotation: -135
    attackRate: 1.3
    soundHit:
      collection: AscentaSwordHit
    soundNoDamage:
      collection: AscentaSwordSwing
    damage:
      types:
        Slash: 22
        Piercing: 8
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: broadsword-left
      right:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: broadsword-right
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - Back
    - SuitStorage
    clothingVisuals:
      belt:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: broadsword-right
      back:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: broadsword-right
      suitStorage:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: broadsword-right

