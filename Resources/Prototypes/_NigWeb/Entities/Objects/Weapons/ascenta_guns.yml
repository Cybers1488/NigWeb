- type: entity
  abstract: true
  parent: BaseItem
  id: NigWebAscentaGunBase
  name: Ascenta Gun Base
  components:
  - type: Sprite
    sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_guns.rsi
  - type: Tag
    tags:
    - Sidearm
  - type: AmmoCounter
  - type: UseDelay
    delay: 0.15
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

# Revolvers

- type: entity
  parent: NigWebAscentaGunBase
  id: NigWebAscentaDuelista
  name: Sclopetum Singulare Duelista
  suffix: Ascenta
  components:
  - type: Sprite
    layers:
    - state: duelista
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: AscentaOldPistolFire
    soundEmpty:
      path: /Audio/_NigWeb/Weapons/Ascenta/gun_empty.ogg
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: NigWebAscentaCartridge357
    capacity: 1
    soundRack:
      path: /Audio/_NigWeb/Weapons/Ascenta/rev_cock.ogg
    soundInsert:
      path: /Audio/_NigWeb/Weapons/Ascenta/rev_magin.ogg
    soundEject:
      collection: AscentaCasingFall
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: duelista-left
      right:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: duelista-right
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - Back
    - SuitStorage
    clothingVisuals:
      belt:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: duelista-right
      back:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: duelista-right
      suitStorage:
      - sprite: _NigWeb/Objects/Weapons/Ascenta/ascenta_inhand.rsi
        state: duelista-right
