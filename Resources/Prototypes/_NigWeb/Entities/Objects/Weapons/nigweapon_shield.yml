- type: Tag
  id: NigWeaponPaladinShield

- type: entity
  parent: [BaseShield, BaseSecurityContraband]
  id: NigWeaponPaladinShield
  name: NigWeapon Scutum Palatini
  description: A heavy kite shield of tempered steel emblazoned with a solemn cross. Absorbs devastating impacts and deflects fatal strikes.
  components:
  - type: Sprite
    sprite: _NigWeb/Objects/Weapons/Melee/nigweapon_paladin_shield.rsi
    state: paladin_shield
  - type: Item
    sprite: _NigWeb/Objects/Weapons/Melee/nigweapon_paladin_shield.rsi
    size: Ginormous
    heldPrefix: null
  - type: Clothing
    sprite: _NigWeb/Objects/Weapons/Melee/nigweapon_paladin_shield.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tag
    tags:
    - NigWeaponPaladinShield
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.65
        Slash: 0.60
        Piercing: 0.65
        Heat: 0.70
      flatReductions:
        Blunt: 3
        Slash: 3
        Piercing: 3
    activeBlockModifier:
      coefficients:
        Blunt: 0.20
        Slash: 0.15
        Piercing: 0.20
        Heat: 0.30
      flatReductions:
        Blunt: 8
        Slash: 8
        Piercing: 8
    blockSound:
      collection: NigWeaponShieldBlock
    passiveBlockFraction: 0.6
    activeBlockFraction: 1.0
  - type: MeleeWeapon
    attackRate: 0.8
    damage:
      types:
        Blunt: 10
    animationRotation: -90
    wideAnimationRotation: -90
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      collection: NigWeaponShieldBash
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: EmitSoundOnLand
    sound:
      collection: NigWeaponShieldDrop
