- type: entity
  id: BookLadyScripture
  name: "Литургия Карнифичина Мортификаторум"
  description: "Древний фолиант в переплете из выдубленной человеческой кожи, страницы которого хранят откровения о фарфоре и сокрушении плоти."
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _NigWeb/Objects/Specific/Lady/lady_scripture.rsi
    state: icon
  - type: Item
    size: Small
  - type: Clickable
  - type: InteractionOutline
  - type: UseDelay
    delay: 5
  - type: LadyScripture
  - type: Paper
    content: |
      «Ибо плоть грешна в своей горделивой гладкости, и лишь сдернутый покров обнажает правду страдания. Да наполнится Calix Carnificinae, и да падет фарфор.»

      О ПРОИСХОЖДЕНИИ МАТЕРИ БОЙНИ:
      Некогда она молила Чудо избавить её от греха телесной красоты. Чудо обратило её плоть в холодный белый фарфор — безжизненную тюрьму мертвой чистоты.

      О СВЯЩЕННОМ СОВЛЕЧЕНИИ:
      Белый фарфор — это ложь и саван. Истинная благодать скрыта под ним. Лишь кровь и плоть способны разъесть глазурь и содрать фарфор с её тела, обнажив трепещущие священные мышцы.

      О ЖЕРТВЕ ДЛАНИ:
      Рука есть корень деяния и греха. Отсекая длань свою или врага своего и опуская её в Calix Carnificinae, ты смываешь грех содеянного.
      Кисти рук, головы, стопы и трепещущие органы угодны Матери Бойни. Но туловище, полное бренного праха, да не коснется чаши святой.

      Когда снимется последний покров — воссияет Золотой Венец, и Пустошь узрит Спасение.
