# SPDX-License-Identifier: MIT

- type: entity
  parent: [ BaseStructureDynamic, BasePaperLabelableVisualized ]
  id: NigWebAscentaChestWooden
  name: Arca Lignea
  suffix: Ascenta
  description: Arca lignea vetus ex OpenSourceWeb.
  components:
  - type: Animateable
  - type: Transform
    noRot: true
  - type: Icon
    sprite: _NigWeb/Structures/Storage/ascenta_chest.rsi
    state: crate
  - type: Sprite
    noRot: true
    sprite: _NigWeb/Structures/Storage/ascenta_chest.rsi
    layers:
    - state: crate
      map: ["enum.StorageVisualLayers.Base"]
    - state: crate
      map: ["enum.StorageVisualLayers.Door"]
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: EntityStorage
    openSound:
      collection: AscentaChestOpen
    closeSound:
      collection: AscentaChestClose
  - type: EntityStorageVisuals
    stateDoorOpen: crateopen
    stateDoorClosed: crate
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
      - Crate
