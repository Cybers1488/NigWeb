- type: entity
  id: NigWebAltarAraAbyssi
  name: Ara Abyssi
  description: Древний колоссальный алтарь глубин с резными каменными уступами и священными чашами.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.0,-1.2,2.0,0.8"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _NigWeb/Structures/Decoration/altar_abyssi.rsi
    state: altar
  - type: Icon
    sprite: _NigWeb/Structures/Decoration/altar_abyssi.rsi
    state: altar
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: NigWebAltarAraPrecum
  name: Ara Precum
  description: Молитвенный алтарь Prie-Dieu с живым пламенем священных свечей.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.7,-1.0,0.7,0.3"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _NigWeb/Structures/Decoration/altar_precum.rsi
    state: lit
  - type: Icon
    sprite: _NigWeb/Structures/Decoration/altar_precum.rsi
    state: lit
  - type: PointLight
    enabled: true
    radius: 4.2
    energy: 1.8
    color: "#ff9933"
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      id: precum_radius_flicker
      property: AnimatedRadius
      isLooped: true
      enabled: true
      minDuration: 0.08
      maxDuration: 0.22
      startValue: 3.4
      endValue: 4.6
    - !type:RandomizeBehaviour
      id: precum_energy_flicker
      property: Energy
      isLooped: true
      enabled: true
      minDuration: 0.06
      maxDuration: 0.18
      startValue: 1.2
      endValue: 2.2
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: NigWebAltarAraCulpaeMeae
  name: Ara Culpae Meae
  description: Каменное святилище с коленопреклоненной фигурой, хранящее освященный клинок Меа Кульпа.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-1.0,1.0,0.3"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _NigWeb/Structures/Decoration/altar_meaculpa.rsi
    state: divine
  - type: Icon
    sprite: _NigWeb/Structures/Decoration/altar_meaculpa.rsi
    state: divine
  - type: PointLight
    enabled: true
    radius: 3.6
    energy: 1.5
    color: "#fae8a0"
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:PulseBehaviour
      id: meaculpa_pulse
      property: AnimatedRadius
      isLooped: true
      enabled: true
      minDuration: 1.6
      maxDuration: 1.6
      startValue: 2.8
      endValue: 4.0
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
