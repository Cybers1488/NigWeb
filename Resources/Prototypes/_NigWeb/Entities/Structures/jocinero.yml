- type: entity
  id: NigWebJocinero
  parent: BaseStructure
  name: Jocinero
  description: Из распоротого чрева жертвенного быка восстает дитя в золотой маске, сжимающее рог. Из его глаз непрерывно струятся кровавые слезы.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-4.0,-3.5,4.0,1.0"
        density: 2500
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Sprite
    sprite: _NigWeb/Structures/jocinero.rsi
    noRot: true
    layers:
    - state: idle
  - type: Icon
    sprite: _NigWeb/Structures/jocinero.rsi
    state: icon
  - type: PointLight
    radius: 4.5
    energy: 2.2
    color: "#8a0808"
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      id: jocinero_radius_flicker
      property: AnimatedRadius
      isLooped: true
      enabled: true
      minDuration: 0.1
      maxDuration: 0.3
      startValue: 3.8
      endValue: 4.8
    - !type:RandomizeBehaviour
      id: jocinero_energy_flicker
      property: Energy
      isLooped: true
      enabled: true
      minDuration: 0.08
      maxDuration: 0.25
      startValue: 1.6
      endValue: 2.4
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
