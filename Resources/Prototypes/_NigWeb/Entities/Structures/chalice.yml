# SPDX-License-Identifier: MIT

- type: entity
  id: LadyBloodChalice
  name: "Calix Carnificinae (Чаша Мясницкой Казни)"
  description: "Тяжелая мраморная чаша для сбора мученической сукровицы и плоти. Принимает отсеченные длани, стопы, головы, конечности и кровь грешников (туловище не поместится). Наполнение чаши сдирает саван с Матери Кровавой Бойни."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.6,0.8,0.6"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _NigWeb/Structures/chalice.rsi
    layers:
    - state: empty
      map: ["chalice_layer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ChaliceVisuals.FillState:
        chalice_layer:
          Empty: { state: empty }
          Quarter: { state: quarter }
          Half: { state: half }
          Full: { state: full }
          Broken: { state: broken }
  - type: Chalice
  - type: InteractionOutline
