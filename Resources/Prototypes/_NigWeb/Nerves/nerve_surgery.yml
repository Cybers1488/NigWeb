- type: entity
  id: SurgeryRepairNerve
  name: Восстановить нерв
  description: Микрохирургическая операция по восстановлению разорванных нервных тканей.
  components:
    - type: Surgery
      steps:
        - SurgeryStepHealNerveScalpel
        - SurgeryStepHealNerveHemostat
        - SurgeryStepHealNerveCautery
    - type: SurgerySeveredNerveCondition

- type: entity
  id: SurgeryStepHealNerveScalpel
  parent: SurgeryStepBase
  name: Зачистить поврежденные ткани нерва
  components:
    - type: SurgeryStep
      tool:
        - type: Scalpel
      add:
        - type: NerveEdgesCleaned
      duration: 4
    - type: Sprite
      sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
      state: scalpel

- type: entity
  id: SurgeryStepHealNerveHemostat
  parent: SurgeryStepBase
  name: Совместить окончания нерва
  components:
    - type: SurgeryStep
      tool:
        - type: Hemostat
      add:
        - type: NerveEndsJoined
      duration: 5
    - type: Sprite
      sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
      state: hemostat

- type: entity
  id: SurgeryStepHealNerveCautery
  parent: SurgeryStepBase
  name: Спаять нервные окончания
  components:
    - type: SurgeryStep
      tool:
        - type: Cautery
      remove:
        - type: NerveEdgesCleaned
        - type: NerveEndsJoined
        - type: SeveredNerve
      duration: 6
    - type: Sprite
      sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
      state: cautery
