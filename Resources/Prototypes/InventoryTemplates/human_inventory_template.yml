- type: inventoryTemplate
  id: human
  slots:
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,1
      strippingWindowPos: 1,0
      displayName: Head
    - name: ears
      slotTexture: ears
      slotFlags: EARS
      stripTime: 3
      uiWindowPos: 0,2
      strippingWindowPos: 2,0
      displayName: Ears
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 1,3
      strippingWindowPos: 0,1
      displayName: Neck
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 2,2
      strippingWindowPos: 0,0
      displayName: Eyes
    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      stripTime: 6
      uiWindowPos: 0,3
      strippingWindowPos: 0,5
      displayName: Back
      blacklist:
        tags:
        - PetOnly
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 6
      uiWindowPos: 1,4
      strippingWindowPos: 1,2
      displayName: Suit
    - name: belt
      slotTexture: belt
      fullTextureName: template_small
      slotFlags: BELT
      stripTime: 6
      uiWindowPos: 1,8
      strippingWindowPos: 1,5
      displayName: Belt
    - name: pocket1
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      stripTime: 3
      uiWindowPos: 0,7
      strippingWindowPos: 0,4
      dependsOn: jumpsuit
      displayName: Pocket 1
      stripHidden: true
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 6
      uiWindowPos: 1,7
      strippingWindowPos: 0,2
      displayName: Jumpsuit
    - name: pocket2
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      stripTime: 3
      uiWindowPos: 2,7
      strippingWindowPos: 1,4
      dependsOn: jumpsuit
      displayName: Pocket 2
      stripHidden: true
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,2
      strippingWindowPos: 1,1
      displayName: Mask
    - name: gloves
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 1,6
      strippingWindowPos: 2,2
      displayName: Gloves
    - name: id
      slotTexture: id
      fullTextureName: template_small
      slotFlags: IDCARD
      stripTime: 6
      uiWindowPos: 2,8
      strippingWindowPos: 2,4
      dependsOn: jumpsuit
      displayName: ID
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 2,5
      dependsOn: outerClothing
      dependsOnComponents:
      - type: AllowSuitStorage
      displayName: Suit Storage
    - name: shoes
      slotTexture: shoes
      slotFlags: FEET
      stripTime: 3
      uiWindowPos: 0,8
      strippingWindowPos: 1,3
      displayName: Shoes
